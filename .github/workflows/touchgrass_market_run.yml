name: 🌿 Touchgrass Market Runner

on:
  schedule:
    # Morning Check: 11:30 AM ET / 15:30 UTC (2 hours after market open)
    - cron: '30 15 * * 1-5'
    # Late Afternoon Check: 3:30 PM ET / 19:30 UTC (30 minutes before market close)
    - cron: '30 19 * * 1-5'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Type of market run (morning, afternoon, manual)'
        required: true
        default: 'manual'

jobs:
  touchgrass-run:
    runs-on: ubuntu-latest
    name: Execute Touchgrass AI Analysis & Portfolio Digest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🌿 Run Touchgrass Morning Check (11:30 AM ET)
        if: github.event.schedule == '30 15 * * 1-5' || github.event.inputs.run_type == 'morning'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py run --type morning

      - name: 🌿 Run Touchgrass Late Afternoon Check (3:30 PM ET)
        if: github.event.schedule == '30 19 * * 1-5' || github.event.inputs.run_type == 'afternoon'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py run --type afternoon

      - name: 🌿 Run Touchgrass Manual Market Run
        if: github.event.inputs.run_type == 'manual' || (github.event.schedule != '30 15 * * 1-5' && github.event.schedule != '30 19 * * 1-5' && github.event_name != 'schedule')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py run --type scheduled

      - name: 💾 Commit updated Watchlist & Daily Reports state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(touchgrass): auto-update watchlist & daily reports [skip ci]"
          file_pattern: "config/watchlist.json reports/*.md"
